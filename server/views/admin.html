<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Echo · 后台管理</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0b0f18;
        color: #dfe7f5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.6;
      }
      h1 { font-size: 16px; letter-spacing: 4px; color: #efc76a; font-weight: 500; }
      h2 { font-size: 13px; color: #7b8bab; font-weight: 500; margin: 20px 0 8px; letter-spacing: 1px; }
      h3 { font-size: 13px; color: #dfe7f5; font-weight: 500; margin: 14px 0 8px; }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .spacer { flex: 1; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .on { background: #7ee2a8; box-shadow: 0 0 8px #7ee2a8; }
      .off { background: #3a4560; }

      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1c2534; }
      th { color: #6c7c9a; font-weight: 500; font-size: 12px; }
      td.num { text-align: right; }
      tbody tr:hover { background: #101725; }

      .card {
        border: 1px solid #1c2534; border-radius: 8px; padding: 12px 14px;
        background: #0f1522; margin-bottom: 10px;
      }
      .card.online { border-color: #2f6b4d; }
      .big { font-size: 15px; }
      .dim { color: #6c7c9a; }
      .ok { color: #7ee2a8; }
      .warn { color: #ff9b8a; }
      .acc { color: #efc76a; }
      .mono-dim { color: #4a5a76; font-size: 12px; }

      input, select {
        background: #131a28; border: 1px solid #26334a; color: #dfe7f5;
        padding: 7px 10px; border-radius: 6px; font-family: inherit; font-size: 13px;
      }
      input { width: 190px; }
      input:focus, select:focus { outline: none; border-color: #4a72b8; }

      button {
        background: #1c2a40; border: 1px solid #3d5a80; color: #dfe7f5;
        padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px;
      }
      button:hover { background: #25375a; }
      button.danger { border-color: #7a3b48; color: #ff9b8a; }
      button.danger:hover { background: #3a1f28; }
      button.tiny { padding: 3px 8px; font-size: 11px; }
      button:disabled { opacity: 0.45; cursor: default; }

      /* ---- 布局 */
      #panel { display: none; }
      #panel.show { display: block; }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 18px 60px; }
      .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 14px 0 4px; border-bottom: 1px solid #1c2534; }
      .tab {
        padding: 8px 14px; color: #6c7c9a; cursor: pointer; font-size: 13px;
        border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0;
        user-select: none;
      }
      .tab:hover { color: #dfe7f5; }
      .tab.active { color: #efc76a; border-color: #1c2534; background: #0f1522; border-bottom: 1px solid #0f1522; margin-bottom: -1px; }
      .view { display: none; padding-top: 14px; }
      .view.active { display: block; }

      /* ---- 统计卡片 */
      .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .stat { border: 1px solid #1c2534; border-radius: 8px; padding: 10px 12px; background: #0f1522; }
      .stat .v { font-size: 20px; color: #dfe7f5; }
      .stat .k { color: #6c7c9a; font-size: 12px; }

      /* ---- 登录 */
      #login { max-width: 380px; margin: 14vh auto; }
      #login input { width: 100%; margin-bottom: 10px; }
      .err { color: #ff9b8a; min-height: 18px; }

      /* ---- 遮罩提示 */
      #toast {
        position: fixed; right: 18px; bottom: 18px; z-index: 60;
        display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
      }
      .toast-item {
        background: #16203a; border: 1px solid #3d5a80; border-radius: 8px;
        padding: 10px 14px; color: #dfe7f5; max-width: 420px;
        animation: pop .18s ease-out;
      }
      .toast-item.err { border-color: #7a3b48; color: #ff9b8a; }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

      /* ---- 抽屉（账号详情） */
      #drawer {
        position: fixed; top: 0; right: 0; width: 460px; max-width: 92vw; height: 100%;
        background: #0d1320; border-left: 1px solid #26334a; z-index: 50;
        overflow-y: auto; padding: 16px 18px; display: none;
      }
      #drawer.show { display: block; }

      details > summary { cursor: pointer; }
      .nowrap { white-space: nowrap; }
      .chip {
        display: inline-block; padding: 1px 7px; border-radius: 999px;
        border: 1px solid #2a3a56; color: #7b8bab; font-size: 11px;
      }
      .chip.off { border-color: #7a3b48; color: #ff9b8a; }
    </style>
  </head>
  <body>
    <!-- 登录：这里的账号【不是】游戏账号，是后台自己的 -->
    <!-- 用标准 <form> 包住：浏览器（尤其 Edge）对不在 form 里的密码框，
         密码管理器/自动填充行为怪异，会抢焦点吞键盘输入 -->
    <form id="login" autocomplete="on">
      <h1>ECHO · 后台管理</h1>
      <p class="dim" style="margin: 8px 0 16px">
        独立于游戏账号 —— 游戏里的账号进不了这里。
      </p>
      <input id="u" placeholder="后台账号" autocomplete="username" />
      <input id="p" type="password" placeholder="密码" autocomplete="current-password" />
      <div class="err" id="err"></div>
      <button id="go" type="submit">登 录</button>
    </form>

    <div id="panel">
      <div class="wrap">
        <div class="row">
          <h1>ECHO · 后台管理</h1>
          <span class="chip" id="who"></span>
          <span class="spacer"></span>
          <span class="dim" id="updated"></span>
          <button id="toggle">暂停刷新</button>
          <button id="out">退出</button>
        </div>

        <div class="tabs" id="tabs"></div>

        <!-- 概览 -->
        <div class="view" id="v-home"></div>
        <!-- 账号 -->
        <div class="view" id="v-users"></div>
        <!-- 会话 -->
        <div class="view" id="v-sessions"></div>
        <!-- 房间 -->
        <div class="view" id="v-rooms"></div>
        <!-- 进度 -->
        <div class="view" id="v-progress"></div>
        <!-- 流水 -->
        <div class="view" id="v-events"></div>
        <!-- 胶囊 -->
        <div class="view" id="v-capsules"></div>
        <!-- 后台账号 -->
        <div class="view" id="v-admins"></div>
        <!-- 审计 -->
        <div class="view" id="v-audit"></div>
      </div>
    </div>

    <div id="drawer"></div>
    <div id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      let me = null; // 当前管理员 { username, role }
      let tab = 'home';
      let running = true;
      let timer = null;

      const TABS = [
        ['home', '概览'],
        ['users', '账号'],
        ['sessions', '会话'],
        ['rooms', '房间'],
        ['progress', '进度'],
        ['events', '流水'],
        ['capsules', '时间胶囊'],
        ['admins', '后台账号'],
        ['audit', '审计'],
      ];

      /* ------------------------------------------------------------ 工具 */

      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (m) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        })[m]);

      const clock = (ts) => new Date(ts).toTimeString().slice(0, 8);
      const dt = (ts) => (ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '—');
      const ago = (ms) => {
        if (ms == null) return '从未';
        const s = Math.floor(ms / 1000);
        if (s < 60) return s + ' 秒前';
        if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
        if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
        return Math.floor(s / 86400) + ' 天前';
      };
      const sec = (ms) => (ms == null ? '—' : (ms / 1000).toFixed(1) + 's');
      const canWrite = () => me && me.role === 'owner';

      function safeJson(s) {
        try { return JSON.parse(s); } catch { return {}; }
      }

      function toast(text, isErr) {
        const el = document.createElement('div');
        el.className = 'toast-item' + (isErr ? ' err' : '');
        el.textContent = text;
        $('toast').appendChild(el);
        setTimeout(() => el.remove(), isErr ? 5200 : 3000);
      }

      /** 危险操作统一走这里：把后果说清楚，再让他确认一次 */
      function askDanger(text) {
        return window.confirm(text);
      }

      async function api(path, opt = {}) {
        const res = await fetch(path, {
          credentials: 'same-origin', // 后台凭证在 HttpOnly Cookie 里，由浏览器自动带上
          ...opt,
          headers: { 'Content-Type': 'application/json', ...(opt.headers || {}) },
        });
        if (res.status === 401) throw new Error('401');
        let data = {};
        try { data = await res.json(); } catch { /* 空响应 */ }
        if (!res.ok) throw new Error(data.error || '操作失败');
        return data;
      }

      const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });
      const patch = (p, body) => api(p, { method: 'PATCH', body: JSON.stringify(body || {}) });
      const del = (p) => api(p, { method: 'DELETE' });

      /* ------------------------------------------------------------ 事件名（沿用看板的中文对照） */

      const NAME = {
        login: '登录',
        'room-created': '建了房间',
        'room-joined': '加入房间',
        'hub-open': '打开地图',
        'intro-done': '看完了开场',
        'select-ending': '打开了那封信',
        'ending-start': '开始读结尾',
        'ending-done': '读完结尾',
        'capsule-saved': '写了时间胶囊',
        'level-start': '进关',
        'level-clear': '通关',
        'level-leave': '离开关卡',
        'level-respawn': '掉坑',
        'level-collect': '拾取',
        'level-hold': '挡雨时长',
        'level-slide': '骑车时长',
        'level-silence': '灯下停留',
        'level-puzzle': '拼图耗时',
        'level-carry': '抬花',
        hesitation: '开场犹豫',
        presence: '在场',
      };

      const LEVEL_NAME = {
        level01: '01 · 出发',
        level02: '02 · 雨',
        level03: '03 · 走廊',
        level04: '04 · 车棚',
        level05: '05 · 雨巷',
        level06: '06 · 钟楼',
        level07: '07 · 天台',
      };

      const AUDIT_NAME = {
        'admin.login': '登录后台',
        'user.create': '新建账号',
        'user.update': '改资料/停用',
        'user.reset_password': '重置密码',
        'user.delete': '删除账号',
        'session.revoke': '踢下线',
        'room.close': '关闭房间',
        'progress.reset': '重置进度',
        'admin.create': '新建后台账号',
        'admin.update': '改后台账号',
        'admin.delete': '删除后台账号',
        'maintenance.sweep': '手动清理',
      };

      /* ------------------------------------------------------------ 登录 / 退出 */

      async function doLogin() {
        $('err').textContent = '';
        const username = $('u').value.trim();
        const password = $('p').value;
        if (!username || !password) return ($('err').textContent = '都填上');
        try {
          const data = await post('/api/admin/login', { username, password });
          me = data.admin;
          boot();
        } catch (e) {
          $('err').textContent = e.message === '401' ? '账号或密码不对' : e.message;
        }
      }

      function boot() {
        $('login').style.display = 'none';
        $('panel').classList.add('show');
        $('who').textContent = `${me.displayName || me.username} · ${me.role === 'owner' ? '管理员' : '只读'}`;
        renderTabs();
        switchTab(tab);
        clearInterval(timer);
        timer = setInterval(() => {
          if (running) refresh().catch(() => {});
        }, 5000);
      }

      function signOut() {
        return post('/api/admin/logout').finally(() => {
          clearInterval(timer);
          me = null;
          $('login').style.display = '';
          $('panel').classList.remove('show');
          closeDrawer();
        });
      }

      /* ------------------------------------------------------------ 标签切换 */

      function renderTabs() {
        $('tabs').innerHTML = TABS.map(
          ([k, label]) =>
            `<div class="tab ${k === tab ? 'active' : ''}" data-tab="${k}">${esc(label)}</div>`
        ).join('');
        $('tabs').onclick = (e) => {
          const t = e.target.closest('.tab');
          if (t) switchTab(t.dataset.tab);
        };
      }

      function switchTab(k) {
        tab = k;
        document.querySelectorAll('.tab').forEach((el) => {
          el.classList.toggle('active', el.dataset.tab === k);
        });
        document.querySelectorAll('.view').forEach((el) => {
          el.classList.toggle('active', el.id === 'v-' + k);
        });
        refresh().catch(() => {});
      }

      /* ------------------------------------------------------------ 刷新 */

      async function refresh() {
        const loaders = {
          home: renderHome,
          users: renderUsers,
          sessions: renderSessions,
          rooms: renderRooms,
          progress: renderProgress,
          events: renderEvents,
          capsules: renderCapsules,
          admins: renderAdmins,
          audit: renderAudit,
        };
        await (loaders[tab] || renderHome)();
        $('updated').textContent = '更新于 ' + clock(Date.now());
      }

      /* ------------------------------------------------------------ 概览 */

      async function renderHome() {
        const [stats, sum] = await Promise.all([api('/api/admin/stats'), api('/api/admin/summary')]);
        const c = stats.counts;
        const r = stats.runtime;

        $('v-home').innerHTML = `
          <div class="stats">
            <div class="stat"><div class="v">${c.users}</div><div class="k">账号总数${
              c.disabledUsers ? ` · ${c.disabledUsers} 个已停用` : ''
            }</div></div>
            <div class="stat"><div class="v">${c.activeSessions}</div><div class="k">有效会话</div></div>
            <div class="stat"><div class="v">${r.clients}</div><div class="k">在线连接 / ${r.liveRooms} 个房间</div></div>
            <div class="stat"><div class="v">${c.eventsToday}</div><div class="k">今日行为 / 共 ${c.eventsTotal}</div></div>
            <div class="stat"><div class="v">${c.clearsTotal}</div><div class="k">通关次数</div></div>
            <div class="stat"><div class="v">${c.capsules}</div><div class="k">时间胶囊</div></div>
            <div class="stat"><div class="v">${(c.dbBytes / 1048576).toFixed(1)}M</div><div class="k">数据库体积</div></div>
            <div class="stat"><div class="v">${Math.floor(r.uptimeSec / 3600)}h</div><div class="k">运行 ${Math.floor(
              (r.uptimeSec % 3600) / 60
            )} 分 · 内存 ${r.heapMB}M</div></div>
          </div>

          <h2>在场</h2>
          ${sum.users
            .map(
              (u) => `<div class="card ${u.online ? 'online' : ''}">
                <div class="row">
                  <span class="dot ${u.online ? 'on' : 'off'}"></span>
                  <span class="big">${esc(u.nickname)}</span>
                  <span class="dim">${u.role === 'bear' ? '小熊' : '小兔'} · ${esc(u.username)}</span>
                  <span class="spacer"></span>
                  <span class="${u.online ? 'ok' : 'dim'}">${u.online ? '在线' : '离线'}</span>
                </div>
                <div class="dim">
                  此刻在：<span class="acc">${esc(u.lastWhere || '—')}</span>
                  · 最后一次动作 ${ago(u.awayMs)} · 上次登录 ${ago(sum.now - (u.lastLoginAt || 0))}
                </div>
              </div>`
            )
            .join('')}

          <h2>关卡</h2>
          <table>
            <thead><tr>
              <th>关卡</th><th class="num">进入</th><th class="num">通过</th>
              <th class="num">离开</th><th class="num">掉坑</th>
              <th class="num">最近耗时</th><th class="num">最快</th><th>最近活动</th>
            </tr></thead>
            <tbody>
              ${
                sum.levels.length
                  ? sum.levels
                      .map(
                        (l) => `<tr>
                    <td>${esc(LEVEL_NAME[l.levelId] || l.levelId)}</td>
                    <td class="num">${l.starts || 0}</td>
                    <td class="num ${l.clears ? 'ok' : ''}">${l.clears || 0}</td>
                    <td class="num ${l.leaves ? 'warn' : ''}">${l.leaves || 0}</td>
                    <td class="num ${l.respawns >= 5 ? 'warn' : ''}">${l.respawns || 0}</td>
                    <td class="num">${sec(l.lastDurationMs)}</td>
                    <td class="num">${sec(l.bestMs)}</td>
                    <td class="dim">${ago(sum.now - (l.lastAt || 0))}</td>
                  </tr>`
                      )
                      .join('')
                  : '<tr><td class="dim" colspan="8">还没有进过关卡</td></tr>'
              }
            </tbody>
          </table>`;
      }

      /* ------------------------------------------------------------ 账号 */

      let userQuery = '';

      async function renderUsers() {
        const q = userQuery;
        const data = await api(`/api/admin/users?q=${encodeURIComponent(q)}&limit=100`);

        if (!$('v-users').dataset.built) {
          $('v-users').innerHTML = `
            <div class="row">
              <input id="uq" placeholder="搜账号或昵称" value="${esc(q)}" />
              <button id="usearch">搜索</button>
              <button id="uclear">清空</button>
              <span class="spacer"></span>
              ${canWrite() ? '<button id="unew">+ 新建账号</button>' : ''}
            </div>
            <div id="utable"></div>`;
          $('v-users').dataset.built = '1';

          $('usearch').onclick = () => ((userQuery = $('uq').value.trim()), refresh());
          $('uclear').onclick = () => {
            userQuery = '';
            $('uq').value = '';
            refresh();
          };
          $('uq').onkeydown = (e) => e.key === 'Enter' && (userQuery = $('uq').value.trim(), refresh());
          if ($('unew')) $('unew').onclick = newUser;
        }

        $('utable').innerHTML = `
          <table>
            <thead><tr>
              <th>ID</th><th>昵称</th><th>账号</th><th>角色</th><th>状态</th>
              <th>创建</th><th>上次登录</th><th class="num">通关</th><th class="num">会话</th><th>操作</th>
            </tr></thead>
            <tbody>
              ${
                data.users.length
                  ? data.users
                      .map(
                        (u) => `<tr>
                    <td class="dim">${u.id}</td>
                    <td>${esc(u.nickname)}</td>
                    <td class="dim">${esc(u.username)}</td>
                    <td>${u.role === 'bear' ? '小熊' : '小兔'}</td>
                    <td>${
                      u.disabled
                        ? '<span class="chip off">已停用</span>'
                        : `<span class="chip ${u.lastEventAt && Date.now() - u.lastEventAt < 25000 ? '' : 'off'}">${
                            u.lastEventAt && Date.now() - u.lastEventAt < 25000 ? '在线' : '离线'
                          }</span>`
                    }</td>
                    <td class="dim">${ago(Date.now() - u.createdAt)}</td>
                    <td class="dim">${ago(Date.now() - (u.lastLoginAt || 0))}</td>
                    <td class="num">${u.cleared}</td>
                    <td class="num">${u.sessions}</td>
                    <td class="nowrap">
                      <button class="tiny" data-detail="${u.id}">详情</button>
                      ${canWrite()
                        ? `<button class="tiny" data-pwd="${u.id}">改密码</button>
                           <button class="tiny" data-ban="${u.id}" data-on="${u.disabled ? 1 : 0}">${
                             u.disabled ? '启用' : '停用'
                           }</button>
                           <button class="tiny danger" data-del="${u.id}">删除</button>`
                        : ''}
                    </td>
                  </tr>`
                      )
                      .join('')
                  : '<tr><td class="dim" colspan="10">没有匹配的账号</td></tr>'
              }
            </tbody>
          </table>`;

        const root = $('utable');
        root.querySelectorAll('[data-detail]').forEach((b) => (b.onclick = () => userDetail(b.dataset.detail)));
        root.querySelectorAll('[data-pwd]').forEach((b) => (b.onclick = () => resetPwd(b.dataset.pwd)));
        root.querySelectorAll('[data-ban]').forEach((b) => (b.onclick = () => toggleBan(b.dataset.ban, b.dataset.on === '1')));
        root.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => deleteUser(b.dataset.del)));
      }

      async function newUser() {
        const username = prompt('账号名（字母数字_-，2~20 位）');
        if (!username) return;
        const nickname = prompt('昵称');
        if (!nickname) return;
        const role = prompt('角色：bear（小熊）或 rabbit（小兔）', 'bear');
        if (!role) return;
        const password = prompt('初始密码（至少 6 位）');
        if (!password) return;

        try {
          await post('/api/admin/users', { username, nickname, role, password });
          toast(`已新建账号 ${username}`);
          refresh();
        } catch (e) {
          toast(e.message, true);
        }
      }

      async function resetPwd(id) {
        const password = prompt('新密码（至少 6 位）');
        if (!password) return;
        try {
          await post(`/api/admin/users/${id}/password`, { password });
          toast('密码已重置');
        } catch (e) {
          toast(e.message, true);
        }
      }

      async function toggleBan(id, currentlyDisabled) {
        const disabled = !currentlyDisabled;
        if (
          disabled &&
          !askDanger('停用后：这个账号会立刻被踢下线，也不能再登录。\n她的进度和数据都还在。\n\n确定停用？')
        ) {
          return;
        }
        try {

      let lastEvents = [];

      function exportCsv(rows) {
        if (!rows.length) return toast('没有可导出的记录', true);
        const head = ['时间', '用户ID', '事件', '数据'];
        const body = rows.map((e) => [
          new Date(e.created_at).toLocaleString('zh-CN', { hour12: false }),
          e.user_id ?? '',
          e.name,
          e.data,
        ]);
        const csv = [head, ...body]
          .map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(','))
          .join('\r\n');
        // BOM：不加的话 Excel 打开是乱码
        const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `echo-events-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      }

                        }
                        return `<tr>
                      <td class="dim nowrap">${dt(l.created_at)}</td>
                      <td>${esc(l.admin_name)}</td>
                      <td class="acc">${esc(AUDIT_NAME[l.action] || l.action)}</td>
                      <td>${esc(l.target || '—')}</td>
                      <td class="dim">${esc(bits.join(' '))}</td>
                      <td class="mono-dim">${esc(l.ip || '—')}</td>
                    </tr>`;
                      })
                      .join('')
                  : '<tr><td class="dim" colspan="6">还没有操作记录</td></tr>'
              }
            </tbody>
          </table>`;
      }

      /* ------------------------------------------------------------ 绑定 */

      $('login').onsubmit = (e) => {
        e.preventDefault(); // 不真发表单请求，仍走 doLogin 的 fetch
        doLogin();
      };
      $('u').onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault(); // 阻止 form 原生提交，这里只把焦点交给密码框
          $('p').focus();
        }
      };
      $('out').onclick = signOut;
      $('toggle').onclick = () => {
        running = !running;
        $('toggle').textContent = running ? '暂停刷新' : '继续刷新';
      };
      document.addEventListener('keydown', (e) => e.key === 'Escape' && closeDrawer());

      // 进页面先看 sessions 里还有没有活着的管理会话
      api('/api/admin/me')
        .then((d) => {
          me = d.admin;
          boot();
        })
        .catch(() => {});
    </script>
  </body>
</html>
